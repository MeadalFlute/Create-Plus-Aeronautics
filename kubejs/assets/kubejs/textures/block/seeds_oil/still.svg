<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 深色底色（种子油基底） -->
  <rect width="32" height="32" fill="#5A4A1F"/>
  
  <!-- 稀疏横向短条纹（泛白光泽），每行1-2条，长度3-6px，不挤满整行 -->
  <!-- 第2行 -->
  <rect x="5" y="2" width="4" height="1" fill="#F2E5B0"/>
  <rect x="20" y="2" width="3" height="1" fill="#E8D5A0"/>
  
  <!-- 第5行 -->
  <rect x="12" y="5" width="5" height="1" fill="#F2E5B0"/>
  
  <!-- 第8行 -->
  <rect x="2" y="8" width="3" height="1" fill="#E8D5A0"/>
  <rect x="18" y="8" width="4" height="1" fill="#F2E5B0"/>
  
  <!-- 第11行 -->
  <rect x="10" y="11" width="6" height="1" fill="#E8D5A0"/>
  <rect x="25" y="11" width="3" height="1" fill="#F2E5B0"/>
  
  <!-- 第14行 -->
  <rect x="7" y="14" width="4" height="1" fill="#F2E5B0"/>
  
  <!-- 第17行 -->
  <rect x="15" y="17" width="5" height="1" fill="#E8D5A0"/>
  <rect x="26" y="17" width="3" height="1" fill="#F2E5B0"/>
  
  <!-- 第20行 -->
  <rect x="3" y="20" width="3" height="1" fill="#F2E5B0"/>
  <rect x="19" y="20" width="4" height="1" fill="#E8D5A0"/>
  
  <!-- 第23行 -->
  <rect x="11" y="23" width="6" height="1" fill="#F2E5B0"/>
  
  <!-- 第26行 -->
  <rect x="8" y="26" width="4" height="1" fill="#E8D5A0"/>
  <rect x="22" y="26" width="3" height="1" fill="#F2E5B0"/>
  
  <!-- 第29行 -->
  <rect x="14" y="29" width="5" height="1" fill="#F2E5B0"/>
</svg>
    